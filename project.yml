name: Revive
options:
  bundleIdPrefix: io.github.mbielle
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions: [en, fr, Base]
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ReviveKit:
    path: Packages/ReviveKit
  # Self-updates (MIT, sparkle-project.org).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Revive:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Helper/io.github.mbielle.Revive.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: ReviveKit
      - package: Sparkle
      - target: ReviveHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Revive
        CFBundleName: Revive
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Updates: feed listed in the repository, archives signed with the maintainer's EdDSA key.
        SUFeedURL: https://raw.githubusercontent.com/mbielle/revive/main/appcast.xml
        SUPublicEDKey: o3e4s4NPQuSE8GreMMZK1elPSf/IL9foTHZPLJ2K7i4=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        NSHumanReadableCopyright: "Free and open source software, licensed under the GPL-3.0."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mbielle.Revive
        PRODUCT_NAME: Revive
        # scripts/make-dmg.sh swaps this for App/Revive-SelfSigned.entitlements on self-signed releases.
        REVIVE_ENTITLEMENTS: App/Revive.entitlements
        CODE_SIGN_ENTITLEMENTS: $(REVIVE_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          # Shipped builds must not let other processes attach a debugger.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  ReviveHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes: ["*.plist"]
    dependencies:
      - package: ReviveKit
    settings:
      base:
        PRODUCT_NAME: ReviveHelper
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mbielle.Revive.Helper
        SKIP_INSTALL: YES
        # Embeds an Info.plist so the helper is signed as io.github.mbielle.Revive.Helper.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

schemes:
  Revive:
    build:
      targets:
        Revive: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ReviveKit/ReviveKitTests
    archive:
      config: Release
